<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>eaty</title>
  <style>
    body { font: 14px/1.4 system-ui, sans-serif; width: 320px; margin: 12px; }
    input { width: 100%; box-sizing: border-box; padding: 6px; margin: 4px 0 8px; }
    button { padding: 6px 10px; }
    ul { padding-left: 18px; margin: 4px 0; }
    li { word-break: break-all; }
    [hidden] { display: none !important; }
    .muted { color: #666; }
    .small { font-size: 12px; }
    .ok { color: #2b8a3e; }
    .err { color: #c92a2a; }
  </style>
</head>
<body>
  <b>eaty: заказы из Wolt</b> <span id="version" class="muted"></span>
  <p class="muted">Открой заказ или историю заказов на wolt.com — продукты попадут в раздел «Дома» твоего аккаунта.</p>
  <label>Адрес приложения
    <input id="url" placeholder="http://localhost:8080">
  </label>
  <form id="signin">
    <label>Логин
      <input id="login" autocomplete="username" autocapitalize="none" spellcheck="false">
    </label>
    <label>Пароль
      <input id="password" type="password" autocomplete="current-password">
    </label>
    <button>Войти</button>
  </form>
  <div id="account" hidden>
    <p>Вход: <b id="who"></b> <button id="signout">Выйти</button></p>
  </div>
  <button id="save">Сохранить адрес</button>
  <button id="check">Проверить связь</button>
  <p id="status" class="muted"></p>
  <p id="last" class="muted"></p>
  <div class="small muted">Что расширение видело на wolt.com:
    <ul id="seen"><li>пока ничего — открой заказ на wolt.com</li></ul>
  </div>
  <button id="debug">Скопировать отладку</button>
  <p id="copied" class="small muted"></p>
  <script src="popup.js"></script>
</body>
</html>
