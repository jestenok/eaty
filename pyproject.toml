[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eaty"
version = "0.2.0"
description = "Что поесть: рестораны Wolt рядом, рецепты на каждый день с таймерами и продукты из Wolt"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "httpx>=0.27",
]

[project.optional-dependencies]
# psycopg: async driver for tests against a local in-memory Postgres (PGlite)
dev = ["pytest>=8", "psycopg[binary]>=3.2"]

[project.scripts]
eaty = "eaty.cli:main"
eaty-web = "eaty.web.app:main"

[tool.setuptools]
packages = ["eaty", "eaty.web", "eaty.web.routers", "eaty.web.services", "eaty.web.migrations"]

[tool.setuptools.package-data]
"eaty.web" = ["static/*"]
"eaty.web.migrations" = ["script.py.mako", "versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
