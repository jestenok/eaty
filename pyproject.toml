# The service runs from src/ (python src/main.py, Docker: python3 /app/src/main.py) and is not
# installed as a package. Dependencies: requirements.txt (runtime), requirements-dev.txt (tests).

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
