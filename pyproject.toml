[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eaty"
version = "0.1.0"
description = "Помогает выбрать, что поесть: рестораны Wolt рядом с хорошим рейтингом"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
eaty = "eaty.cli:main"

[tool.setuptools]
packages = ["eaty"]

[tool.pytest.ini_options]
testpaths = ["tests"]
